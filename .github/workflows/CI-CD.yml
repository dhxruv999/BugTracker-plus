name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            dhxruv/bugtracker-plus-backend:${{ github.sha }}
            dhxruv/bugtracker-plus-backend:latest
          cache-from: type=registry,ref=dhxruv/bugtracker-plus-backend:latest
          cache-to: type=inline

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            dhxruv/bugtracker-plus-frontend:${{ github.sha }}
            dhxruv/bugtracker-plus-frontend:latest
          build-args: |
            VITE_API_URL=/api
          cache-from: type=registry,ref=dhxruv/bugtracker-plus-frontend:latest
          cache-to: type=inline


  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/bugtracker-plus
            docker-compose pull

            docker image prune -af || true
            
            docker-compose up -d

            sleep 10

            curl --fail http://localhost:8000/
            docker exec bugtracker-backend curl -fsS http://localhost:4000/health 

