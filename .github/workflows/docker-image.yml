name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: dhxruv/bugtracker-plus-backend:latest
          cache-from: type=registry,ref=dhxruv/bugtracker-plus-backend:latest
          cache-to: type=inline

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: dhxruv/bugtracker-plus-frontend:latest
          build-args: |
            VITE_API_URL=http://${{ secrets.EC2_PUBLIC_IP }}:4000/api
          cache-from: type=registry,ref=dhxruv/bugtracker-plus-frontend:latest
          cache-to: type=inline
